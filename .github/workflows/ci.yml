# 持续集成（v0.5.0 新增）：push 自动跑规则引擎对拍 + 数据校验 + 合成音频引擎测试 + 构建。
# 注意：真实歌曲对拍（test_frontend_analyze.mjs）需要本地版权音频与 ffmpeg，只在本地跑，
# 不在 CI 跑；CI 用纯 JS 合成的节拍音覆盖引擎的半速加倍/慢歌不加倍逻辑。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: app

      - name: 规则引擎对拍（25 项）
        run: node spike/test_plan_engine.mjs

      - name: Store 冒烟测试（24 项，v0.5.1 起，v0.8.0 增计时/草稿落盘/失败通知/备份覆盖）
        run: node spike/test_stores_smoke.mjs

      - name: 套路归类规则 + 设备建议回归（53 项，v0.6.0 起，v0.8.0 增套路名映射护栏）
        run: node spike/test_tone_guide.mjs

      - name: 面板组件渲染冒烟（13 项，v0.6.2）
        run: node spike/test_panels_render.mjs

      - name: 数据完整性校验（767 项）
        run: node spike/test_sheets.mjs

      - name: 分析引擎合成音频测试（半速加倍 / 慢歌不加倍）
        run: node spike/test_frontend_synthetic.mjs

      - name: 云同步校验（13 项，v0.11.0：方向决策/白名单/快照/覆盖语义）
        run: node spike/test_sync.mjs

      - name: 生产构建
        run: npm run build
        working-directory: app
